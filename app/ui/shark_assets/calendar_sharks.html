<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar ASCII Sharks Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fafbfe;
      user-select: none;
      -webkit-user-select: none;
    }
    #shark-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Frosted glass diffusion layer covering the calendar body across 1d, 3d, 5d, and month */
    .calendar-frost-glass {
      position: absolute;
      top: 52px;
      left: 18px;
      right: 18px;
      bottom: 14px;
      border-radius: 14px;
      backdrop-filter: blur(4.5px) saturate(135%);
      -webkit-backdrop-filter: blur(4.5px) saturate(135%);
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(100, 116, 139, 0.16);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="shark-canvas"></canvas>
  <div class="calendar-frost-glass" id="calendar-frost-glass"></div>

  <script src="sharks.js"></script>
  <script>
    const canvas = document.getElementById("shark-canvas");
    const engine = new window.OceanEngine(canvas, [
      { kind: "hammerhead", size: 1.0 },
      { kind: "classic", size: 0.88 },
      { kind: "thresher", size: 0.92 },
      { kind: "mako", size: 0.78 }
    ]);
  </script>
</body>
</html>
